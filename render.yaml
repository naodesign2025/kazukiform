services:
  - type: web
    name: kazukiform
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kazukiform-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: kazukiform-db
    plan: free
